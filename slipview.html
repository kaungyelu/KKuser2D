<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .active-time-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #3498db;
            position: relative;
        }

        .active-time-text {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s;
        }

        .active-time-text:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .search-section {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-label {
            color: #2c3e50;
            font-weight: bold;
            white-space: nowrap;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Pyidaungsu', sans-serif;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        .search-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .clear-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Pyidaungsu', sans-serif;
            font-weight: bold;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: #7f8c8d;
        }

        .slips-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .slip-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .slip-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .slip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .slip-number {
            background: #3498db;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            flex: 1;
        }

        .bet-list {
            margin: 15px 0;
        }

        .bet-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 16px;
            border-bottom: 1px dotted #eee;
        }

        .bet-row:last-child {
            border-bottom: none;
        }

        .bet-number {
            color: #2c3e50;
            font-weight: bold;
            min-width: 60px;
        }

        .bet-amount {
            color: #27ae60;
            font-weight: bold;
            text-align: right;
        }

        .slip-total {
            text-align: right;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            font-weight: bold;
            color: #e74c3c;
            font-size: 18px;
        }

        .grand-total-section {
            background: #34495e;
            color: white;
            padding: 20px;
            text-align: center;
            border-top: 3px solid #3498db;
        }

        .grand-total-text {
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
        }

        .loading-container {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #7f8c8d;
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #95a5a6;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
            background: #ffeaea;
            border-radius: 10px;
            margin: 20px;
            border: 2px solid #ffcccc;
        }

        .back-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Pyidaungsu', sans-serif;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #2980b9;
        }

        @media (max-width: 600px) {
            .container {
                border-radius: 10px;
            }
            
            .active-time-header {
                padding: 15px;
            }
            
            .active-time-text {
                font-size: 18px;
                padding: 8px 16px;
            }
            
            .search-section {
                padding: 10px;
                flex-direction: column;
            }
            
            .slips-container {
                padding: 10px;
                max-height: 400px;
            }
            
            .slip-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .grand-total-section {
                padding: 15px;
            }
            
            .grand-total-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Active Time Header -->
        <div class="active-time-header">
            <div class="active-time-text" id="activeTime">
                Loading...
            </div>
        </div>
        
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-label">နံပါတ်ရှာရန်:</div>
            <input type="text" 
                   class="search-input" 
                   id="searchInput" 
                   placeholder="00-99" 
                   maxlength="2"
                   inputmode="numeric">
            <button class="clear-btn" id="clearBtn">ရှင်းမည်</button>
        </div>
        
        <!-- Slips Container -->
        <div class="slips-container" id="slipsContainer">
            <div class="loading-container" id="loadingContainer">
                <div class="spinner"></div>
                <div class="loading-text">ဘောင်ချာများရယူနေသည်...</div>
            </div>
        </div>
        
        <!-- Grand Total Section -->
        <div class="grand-total-section">
            <div>စုစုပေါင်း</div>
            <div class="grand-total-text" id="grandTotal">0</div>
        </div>
    </div>

    <!-- Supabase Configuration (EXACTLY as in slip.html) -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://ugfmzaxrbxvjecqpezdm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnZm16YXhyYnh2amVjcXBlemRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5OTc0NDMsImV4cCI6MjA4MDU3MzQ0M30.rEjWWdKVc_oikOFzQeBJ3I1j3Xke4Pla5DMbsQtugjU';
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    
    <script src="su.js"></script>
    
    <script>
        // Global variables
        let allSlips = [];
        let filteredSlips = [];
        let searchTerm = '';
        let currentKey = '';
        let slipCounter = 0;
        
        // DOM Elements
        const activeTimeEl = document.getElementById('activeTime');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const slipsContainerEl = document.getElementById('slipsContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const grandTotalEl = document.getElementById('grandTotal');
        
        // Main initialization
        document.addEventListener('DOMContentLoaded', function() {
            console.log('SlipView page loaded');
            initPage();
        });
        
        async function initPage() {
            try {
                // Get parameters from URL
                const params = getUrlParams();
                console.log('URL Parameters:', params);
                
                // Check if we have key or date/time parameters
                if (params.key) {
                    currentKey = params.key;
                } else if (params.date && params.time) {
                    currentKey = `${params.date} ${params.time}`;
                } else {
                    showError('အချိန်ရွေးချယ်မှုမရှိပါ။');
                    return;
                }
                
                // Display active time
                activeTimeEl.textContent = currentKey;
                
                // Make active time clickable to go to slipall.html
                setupActiveTimeNavigation();
                
                // Initialize Supabase
                const supabase = initSupabase();
                if (!supabase) {
                    showError('Database connection failed');
                    return;
                }
                
                // Load data once
                await loadDataOnce(supabase);
                
                // Setup event listeners
                setupEventListeners();
                
            } catch (error) {
                console.error('Initialization error:', error);
                showError('စတင်ရာတွင် အမှားတစ်ခုဖြစ်နေသည်။');
            }
        }
        
        // Initialize Supabase (same as slip.html)
        function initSupabase() {
            try {
                if (!window.supabase || !SUPABASE_URL || !SUPABASE_ANON_KEY) {
                    throw new Error('Supabase configuration missing');
                }
                
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('Supabase initialized successfully');
                return supabase;
                
            } catch (error) {
                console.error('Failed to initialize Supabase:', error);
                return null;
            }
        }
        
        // Get URL parameters (same as slip.html)
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split('&');
            
            for (let i = 0; i < pairs.length; i++) {
                const pair = pairs[i].split('=');
                if (pair[0]) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
                }
            }
            return params;
        }
        
        // Setup active time navigation to slipall.html
        function setupActiveTimeNavigation() {
            activeTimeEl.addEventListener('click', function() {
                if (currentKey) {
                    // Check format "DD/MM/YYYY HH:MM"
                    if (currentKey.match(/\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}/)) {
                        const [datePart, timePart] = currentKey.split(' ');
                        window.location.href = `slipall.html?date=${encodeURIComponent(datePart)}&time=${encodeURIComponent(timePart)}`;
                    } else {
                        window.location.href = `slipall.html?key=${encodeURIComponent(currentKey)}`;
                    }
                }
            });
            
            // Add hover effects
            activeTimeEl.style.cursor = 'pointer';
            activeTimeEl.title = 'Slip All ကြည့်ရန် နှိပ်ပါ';
        }
        
        // Load data ONLY ONCE from Supabase
        async function loadDataOnce(supabase) {
            try {
                if (!currentKey) {
                    showError('အချိန်ရွေးချယ်မှုမရှိပါ။');
                    return;
                }
                
                console.log('Loading slips for key:', currentKey);
                
                // Fetch data from Supabase (ONE TIME ONLY)
                const { data, error } = await supabase
                    .from('sales')
                    .select('*')
                    .eq('key', currentKey)
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('Supabase error:', error);
                    throw error;
                }
                
                console.log('Data received from Supabase:', data);
                
                if (!data || data.length === 0) {
                    showEmptyState();
                    return;
                }
                
                // Store all slips
                allSlips = data;
                filteredSlips = [...allSlips];
                
                // Display slips
                displaySlips();
                
                // Hide loading
                loadingContainer.style.display = 'none';
                
            } catch (error) {
                console.error('Error loading data:', error);
                showError('ဒေတာရယူရာတွင် အမှားဖြစ်နေသည်။');
            }
        }
        
        // Display slips (similar to Android Java version)
        function displaySlips() {
            if (filteredSlips.length === 0) {
                showEmptyState();
                return;
            }
            
            let totalGrandTotal = 0;
            let html = '';
            
            // Number slips from highest to lowest (like Android)
            slipCounter = filteredSlips.length;
            
            filteredSlips.forEach((slip, index) => {
                // Calculate slip total
                let slipTotal = slip.total_amount || slip.total || 0;
                
                // Get bets for this slip
                let bets = getBetsFromSlip(slip);
                
                // If searching, filter bets
                let displayBets = bets;
                if (searchTerm && searchTerm.length === 2) {
                    displayBets = bets.filter(bet => {
                        const betNumber = formatBetNumber(bet);
                        return betNumber === searchTerm;
                    });
                    
                    // Skip slip if no matching bets
                    if (displayBets.length === 0) {
                        return;
                    }
                    
                    // Recalculate slip total for filtered bets
                    slipTotal = displayBets.reduce((sum, bet) => sum + (bet.amount || 0), 0);
                }
                
                // Add to grand total
                totalGrandTotal += slipTotal;
                
                // Create slip HTML (similar to Android layout)
                html += `
                    <div class="slip-item">
                        <div class="slip-header">
                            <div class="slip-number">${slipCounter}</div>
                            <div class="user-name">${slip.name || 'No Name'}</div>
                        </div>
                        <div class="bet-list">
                `;
                
                // Add bet rows (like Android: "01-1000")
                displayBets.forEach(bet => {
                    const betNumber = formatBetNumber(bet);
                    const amount = Math.round(bet.amount || 0);
                    
                    html += `
                        <div class="bet-row">
                            <div class="bet-number">${betNumber}</div>
                            <div class="bet-amount">${amount}</div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                        <div class="slip-total">Total = ${Math.round(slipTotal)}</div>
                    </div>
                `;
                
                slipCounter--;
            });
            
            // Update UI
            slipsContainerEl.innerHTML = html;
            grandTotalEl.textContent = Math.round(totalGrandTotal);
            
            // Show empty state if no slips after filtering
            if (slipsContainerEl.innerHTML === '') {
                showEmptyState();
            }
        }
        
        // Helper function to get bets from slip
        function getBetsFromSlip(slip) {
            let bets = [];
            
            try {
                if (slip.bets && Array.isArray(slip.bets)) {
                    bets = slip.bets;
                } else if (slip.numbers && Array.isArray(slip.numbers)) {
                    // Convert numbers array to bets format
                    const total = slip.total_amount || slip.total || 0;
                    const avgAmount = total / slip.numbers.length;
                    bets = slip.numbers.map(num => ({
                        display: num.toString().padStart(2, '0'),
                        number: num,
                        amount: Math.round(avgAmount)
                    }));
                }
            } catch (e) {
                console.error('Error getting bets:', e);
            }
            
            return bets;
        }
        
        // Helper function to format bet number
        function formatBetNumber(bet) {
            return (bet.display || bet.number || bet.num || '00').toString().padStart(2, '0');
        }
        
        // Setup event listeners
        function setupEventListeners() {
            // Search input
            searchInput.addEventListener('input', function(e) {
                searchTerm = e.target.value.trim();
                
                // Only filter if we have 2 digits
                if (searchTerm.length === 2 && /^\d{2}$/.test(searchTerm)) {
                    filterSlips();
                } else if (searchTerm.length === 0) {
                    resetFilter();
                }
            });
            
            // Clear button
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                searchTerm = '';
                resetFilter();
            });
            
            // Allow only numbers
            searchInput.addEventListener('keypress', function(e) {
                if (e.key < '0' || e.key > '9') {
                    e.preventDefault();
                }
            });
            
            // Auto-select on focus
            searchInput.addEventListener('focus', function() {
                this.select();
            });
        }
        
        // Filter slips by search term
        function filterSlips() {
            if (!searchTerm || searchTerm.length !== 2) {
                return;
            }
            
            filteredSlips = [];
            
            allSlips.forEach(slip => {
                const bets = getBetsFromSlip(slip);
                const hasMatch = bets.some(bet => {
                    const betNumber = formatBetNumber(bet);
                    return betNumber === searchTerm;
                });
                
                if (hasMatch) {
                    filteredSlips.push(slip);
                }
            });
            
            displaySlips();
        }
        
        // Reset to show all slips
        function resetFilter() {
            filteredSlips = [...allSlips];
            displaySlips();
        }
        
        // Show empty state
        function showEmptyState() {
            loadingContainer.style.display = 'none';
            slipsContainerEl.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div style="font-size: 18px; margin-bottom: 10px;">ဘောင်ချာများမရှိသေးပါ</div>
                    <button class="back-btn" onclick="goBack()">နောက်သို့ပြန်သွားရန်</button>
                </div>
            `;
            grandTotalEl.textContent = '0';
        }
        
        // Show error state
        function showError(message) {
            loadingContainer.style.display = 'none';
            slipsContainerEl.innerHTML = `
                <div class="error-state">
                    <div style="font-size: 18px; margin-bottom: 10px;">${message}</div>
                    <button class="back-btn" onclick="goBack()">နောက်သို့ပြန်သွားရန်</button>
                </div>
            `;
            grandTotalEl.textContent = '0';
        }
        
        // Go back function
        function goBack() {
            window.history.back();
        }
        
        // Make functions globally available
        window.refreshData = async function() {
            const supabase = initSupabase();
            if (supabase) {
                loadingContainer.style.display = 'block';
                await loadDataOnce(supabase);
            }
        };
        
        window.goBack = goBack;
    </script>
</body>
</html>
